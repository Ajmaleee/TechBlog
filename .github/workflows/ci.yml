name: Validate & Build

# Cloudflare Pages' native Git integration handles the actual deployment
# (see README → "Cloudflare deployment"), so this workflow's job is to
# fail loudly, *before* Cloudflare ever attempts a deploy, when Markdown
# content or the build itself is broken.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content (frontmatter, slugs, cover images)
        run: npm run validate:content

      - name: Type-check + build site
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://example.com' }}

      - name: Upload build output (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
